<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#6c4ef6" />
    <meta name="description" content="Glamp is a private workspace for notes, plans, and to-dos." />
    <title>Glamp · Notes &amp; Tasks</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/glamp.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="/style.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>
    <svg xmlns="http://www.w3.org/2000/svg" class="symbols" aria-hidden="true" focusable="false">
      <symbol id="i-tent" viewBox="0 0 24 24">
        <path d="m3.5 18.5 8.5-13 8.5 13H3.5Z" />
        <path d="M9.5 18.5 12 13l2.5 5.5" />
      </symbol>
      <symbol id="i-lock" viewBox="0 0 24 24">
        <rect x="5" y="10" width="14" height="11" rx="2.5" />
        <path d="M8 10V7a4 4 0 0 1 8 0v3m-4 5v2" />
      </symbol>
      <symbol id="i-doc" viewBox="0 0 24 24">
        <path d="M14 3.5H7a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8.5Zm0 0V8.5h5M8.5 13h7m-7 3.5h4.5" />
      </symbol>
      <symbol id="i-book" viewBox="0 0 24 24">
        <path d="M4 6.5A2.5 2.5 0 0 1 6.5 4H10l2 2h5.5A2.5 2.5 0 0 1 20 8.5v9a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 17.5Z" />
      </symbol>
      <symbol id="i-board" viewBox="0 0 24 24">
        <rect x="3.5" y="4" width="7" height="16" rx="2" />
        <rect x="13.5" y="4" width="7" height="11" rx="2" />
      </symbol>
      <symbol id="i-task" viewBox="0 0 24 24">
        <rect x="3.5" y="3.5" width="17" height="17" rx="4.5" />
        <path d="m8 12.2 2.7 2.8 5.6-6" />
      </symbol>
      <symbol id="i-calendar" viewBox="0 0 24 24">
        <rect x="3.5" y="5" width="17" height="15.5" rx="3" />
        <path d="M8 3.2v3.6m8-3.6v3.6M3.5 10h17m-12 4h2m3.5 0h2" />
      </symbol>
      <symbol id="i-search" viewBox="0 0 24 24">
        <circle cx="10.5" cy="10.5" r="6.5" />
        <path d="m15.5 15.5 5 5" />
      </symbol>
      <symbol id="i-filter" viewBox="0 0 24 24">
        <path d="M4 6h16l-6.2 7.2v5.3l-3.6 1.5v-6.8Z" />
      </symbol>
      <symbol id="i-send" viewBox="0 0 24 24">
        <path d="M4.5 12h15m-6-6 6 6-6 6" />
      </symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></symbol>
      <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6" /></symbol>
      <symbol id="i-next" viewBox="0 0 24 24"><path d="m9.5 6 6 6-6 6" /></symbol>
      <symbol id="i-prev" viewBox="0 0 24 24"><path d="m14.5 6-6 6 6 6" /></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6" /></symbol>
      <symbol id="i-bell" viewBox="0 0 24 24">
        <path d="M5.5 17h13l-1.5-3V9.5a5 5 0 0 0-10 0V14ZM10 20a2.2 2.2 0 0 0 4 0" />
      </symbol>
      <symbol id="i-exit" viewBox="0 0 24 24"><path d="M10 4.5H6a1.5 1.5 0 0 0-1.5 1.5v12A1.5 1.5 0 0 0 6 19.5h4M9 12h11m-4-4 4 4-4 4" /></symbol>
      <symbol id="i-edit" viewBox="0 0 24 24">
        <path d="m4.5 15.5 11-11a2 2 0 0 1 2.8 0l1.2 1.2a2 2 0 0 1 0 2.8l-11 11-4.8 1Z" />
      </symbol>
      <symbol id="i-link" viewBox="0 0 24 24">
        <path
          d="m10 14 4-4m-5 6-1.8 1.8a3.5 3.5 0 0 1-5-5L4 11a3.5 3.5 0 0 1 5 0m2 1 1.8-1.8a3.5 3.5 0 1 1 5 5L16 17a3.5 3.5 0 0 1-5 0"
        />
      </symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.8 4.8L19.5 7.5" /></symbol>
      <symbol id="i-image" viewBox="0 0 24 24">
        <rect x="3.5" y="4" width="17" height="16" rx="2.5" />
        <circle cx="8.5" cy="9" r="1.4" />
        <path d="m4.5 17 4-4 3 3 3.5-6 5 7" />
      </symbol>
      <symbol id="i-review" viewBox="0 0 24 24">
        <path d="M2.5 12s3.8-6.5 9.5-6.5S21.5 12 21.5 12s-3.8 6.5-9.5 6.5S2.5 12 2.5 12Z" />
        <circle cx="12" cy="12" r="2.5" />
      </symbol>
    </svg>

    <header class="masthead">
      <div class="shell mast-inner">
        <div class="brand">
          <span class="brand-mark">
            <svg class="icon" aria-hidden="true"><use href="#i-tent" /></svg>
          </span>
          <span class="brand-name">Glamp</span>
        </div>
        <nav id="views" class="views" aria-label="Workspace views" hidden>
          <button data-view="docs" aria-current="page" type="button">
            <svg class="icon" aria-hidden="true"><use href="#i-book" /></svg><span>Notes</span>
          </button>
          <button data-view="todos" type="button">
            <svg class="icon" aria-hidden="true"><use href="#i-task" /></svg><span>To-dos</span>
          </button>
          <button data-view="board" type="button">
            <svg class="icon" aria-hidden="true"><use href="#i-board" /></svg><span>Board</span>
          </button>
          <button data-view="calendar" type="button">
            <svg class="icon" aria-hidden="true"><use href="#i-calendar" /></svg><span>Calendar</span>
          </button>
        </nav>
        <span id="private-label" class="pill-tag header-right">
          <svg class="icon" aria-hidden="true"><use href="#i-lock" /></svg> Private
        </span>
        <div id="account" class="header-right" hidden>
          <button id="push" class="btn ghost" type="button">
            <svg class="icon" aria-hidden="true"><use href="#i-bell" /></svg><span>Enable push</span>
          </button>
          <button id="logout" class="btn ghost" type="button">
            <svg class="icon" aria-hidden="true"><use href="#i-exit" /></svg><span>Sign out</span>
          </button>
        </div>
      </div>
    </header>

    <main id="main" class="shell" tabindex="-1">
      <p id="boot" class="boot quiet" role="status">Opening workspace…</p>
      <noscript><p class="boot">Enable JavaScript to open this workspace.</p></noscript>

      <section id="gate" class="gate" hidden aria-labelledby="gate-title">
        <div class="gate-card">
          <div class="gate-badge">
            <span class="brand-mark large">
              <svg class="icon" aria-hidden="true"><use href="#i-tent" /></svg>
            </span>
          </div>
          <span class="pill-tag soft-violet">Owner access</span>
          <h1 id="gate-title">Welcome back to Glamp</h1>
          <p class="intro">Sign in with your workspace owner token to view your notes, plans, and to-dos.</p>
          <form id="login-form">
            <label for="token">Owner token</label>
            <input
              id="token"
              name="token"
              type="password"
              autocomplete="current-password"
              required
              placeholder="Enter owner token"
              spellcheck="false"
              autocapitalize="none"
            />
            <p id="login-error" class="error-text" role="alert"></p>
            <button id="login" type="submit" class="btn primary full">
              <span>Sign in</span>
              <svg class="icon" aria-hidden="true"><use href="#i-arrow" /></svg>
            </button>
          </form>
        </div>
      </section>

      <section id="workspace" class="workspace-sheet" hidden aria-labelledby="workspace-title">
        <div class="sheet-header">
          <div class="sheet-title-group">
            <h1 id="workspace-title" tabindex="-1">Notes and tasks</h1>
            <button id="filter-toggle" class="icon-chip" type="button" aria-expanded="true" aria-controls="filter-bar" aria-label="Toggle filters">
              <svg class="icon" aria-hidden="true"><use href="#i-filter" /></svg>
            </button>
            <span class="count" id="card-count"></span>
          </div>
          <div class="sheet-header-actions">
            <button id="add" class="btn outline" type="button">
              <svg class="icon" aria-hidden="true"><use href="#i-plus" /></svg><span>Add card</span>
            </button>
          </div>
        </div>

        <form id="quick-add" class="quick-add" autocomplete="off">
          <label class="sr-only" for="quick-input">Quick add a note or task</label>
          <input
            id="quick-input"
            type="text"
            maxlength="200"
            placeholder="What’s on your mind today?"
          />
          <div class="quick-actions">
            <button id="quick-expand" class="quick-btn soft" type="button" aria-label="Open full card editor" title="Open full editor">
              <svg class="icon" aria-hidden="true"><use href="#i-plus" /></svg>
            </button>
            <button id="quick-submit" class="quick-btn send" type="submit" aria-label="Quick save card" title="Save card">
              <svg class="icon" aria-hidden="true"><use href="#i-send" /></svg>
            </button>
          </div>
        </form>

        <div id="filter-bar" class="filter-bar">
          <div class="filter-chips" role="group" aria-label="Filter cards">
            <label class="filter-chip" id="chip-type-wrap">
              <span class="chip-prefix">Type:</span>
              <select id="filter-type" aria-label="Filter by type">
                <option value="all">All</option>
                <option value="note">Notes</option>
                <option value="task">To-dos</option>
              </select>
            </label>
            <label class="filter-chip" id="chip-time-wrap">
              <span class="chip-prefix">Time:</span>
              <select id="filter-time" aria-label="Filter by schedule">
                <option value="all">All</option>
                <option value="today">Today</option>
                <option value="upcoming">Upcoming</option>
                <option value="past">Past</option>
                <option value="unscheduled">Unscheduled</option>
              </select>
            </label>
            <label class="filter-chip" id="chip-status-wrap">
              <span class="chip-prefix">Status:</span>
              <select id="filter-status" aria-label="Filter by status">
                <option value="all">All</option>
                <option value="open">Open</option>
                <option value="review">Review</option>
                <option value="done">Done</option>
              </select>
            </label>
            <button id="filter-clear" class="chip-reset" type="button" hidden>Reset</button>
          </div>
          <label class="search">
            <svg class="icon" aria-hidden="true"><use href="#i-search" /></svg>
            <span class="sr-only">Search cards</span>
            <input id="search" type="search" placeholder="Search…" autocomplete="off" />
          </label>
        </div>

        <h2 id="view-title" class="sr-only">Notes and tasks</h2>
        <div id="results" aria-labelledby="view-title"></div>
      </section>
    </main>

    <footer class="shell colophon">
      <span><svg class="icon" aria-hidden="true"><use href="#i-tent" /></svg> Glamp</span>
      <span class="colophon-note">Notes, plans &amp; to-dos</span>
    </footer>

    <dialog id="dialog" aria-labelledby="dialog-title">
      <div class="dialog-bar">
        <span class="dialog-eyebrow">
          <svg class="icon" aria-hidden="true"><use href="#i-book" /></svg>
          <span>Card details</span>
        </span>
        <button class="btn icon-only ghost" id="close" aria-label="Close card" type="button">
          <svg class="icon" aria-hidden="true"><use href="#i-close" /></svg>
        </button>
      </div>
      <div id="detail"></div>
      <p id="dialog-message" role="status" class="dialog-message"></p>
    </dialog>

    <div id="notice" class="notice" role="status" aria-live="polite" aria-atomic="true"></div>
  </body>
</html>
