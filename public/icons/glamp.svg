<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Glamp</title>
  <desc id="desc">A folded golden tent stands on a stack of field cards against a deep pine background.</desc>
  <rect width="512" height="512" fill="#103632"/>
